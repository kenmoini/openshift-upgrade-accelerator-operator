# Always run basic Golang tests
name: Tests

on:
  push:
    paths-ignore:
      - README.md
      - DEV.md
      - RELEASE.md
      - .github/dependabot.yml
      - .github/workflows/**
      - .devcontainer/**
  # Disable pull_request to prevent malicious PRs
  # pull_request:
  #   paths-ignore:
  #     - README.md
  #     - DEV.md
  #     - RELEASE.md
  #     - .github/dependabot.yml
  #     - .github/workflows/**
  #     - .devcontainer/**

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
